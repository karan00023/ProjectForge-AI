name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: projectforge
          POSTGRES_PASSWORD: projectforge
          POSTGRES_DB: projectforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projectforge" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://projectforge:projectforge@localhost:5432/projectforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: Lint & format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (real PostgreSQL)
        run: uv run pytest -q
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes) || echo "::warning::pip-audit reported findings"
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported findings"

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: projectforge
          POSTGRES_PASSWORD: projectforge
          POSTGRES_DB: projectforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U projectforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql+psycopg://projectforge:projectforge@localhost:5432/projectforge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend setup
        working-directory: backend
        run: uv sync --frozen && uv run alembic upgrade head
      - name: Frontend setup
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
