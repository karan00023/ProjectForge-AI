[project]
name = "projectforge-backend"
version = "0.1.0"
description = "ProjectForge AI backend: domain API, deterministic engines, AI and agent orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.200",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "argon2-cffi>=25.1",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
  "mypy>=2.4",
  "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/seed/**" = ["S105", "S106", "S311", "E501"]
"alembic/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["app.services.*", "app.core.*"]
strict = true
